services:
  auto-kyara:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-auto-kyara}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
